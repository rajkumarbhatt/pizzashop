<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    /* Accordion container */
    .accordion {
      border: 1px solid #ddd;
      border-radius: 5px;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Accordion item */
    .accordion-item {
      border-bottom: 1px solid #ddd;
    }

    .accordion-item:last-child {
      border-bottom: none;
    }

    /* Accordion header */
    .accordion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background-color: #fff;
      cursor: pointer;
    }

    .accordion-header:hover {
      background-color: #f9f9f9;
    }

    /* Accordion title */
    .accordion-title {
      font-weight: bold;
      font-size: 16px;
    }

    /* Accordion controls */
    .accordion-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-btn {
      background-color: #fff;
      border: 1px solid #ddd;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 3px;
    }

    .quantity-btn:hover {
      background-color: #f0f0f0;
    }

    .quantity {
      font-weight: bold;
    }

    .price,
    .amount {
      font-size: 14px;
      color: #555;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #d9534f;
      font-size: 16px;
    }

    .delete-btn:hover {
      color: #c9302c;
    }

    /* Accordion body */
    .accordion-body {
      padding: 10px 15px;
      background-color: #f9f9f9;
      display: none; /* Hidden by default */
    }

    .accordion-body ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .accordion-body li {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 14px;
      color: #555;
    }

    /* Active state */
    .accordion-item.active .accordion-body {
      display: block;
    }
  </style>
  <body>
    <div class="accordion">
      <div class="accordion-item">
        <div class="accordion-header">
          <span class="accordion-title">Chocolate Sundae</span>
          <div class="accordion-controls">
            <button class="quantity-btn">-</button>
            <span class="quantity">1</span>
            <button class="quantity-btn">+</button>
            <span class="price">₹45.00</span>
            <span class="amount">₹0.00</span>
            <button class="delete-btn">🗑</button>
          </div>
        </div>
      </div>

      <div class="accordion-item">
        <div class="accordion-header">
          <span class="accordion-title">Margherita Pizza</span>
          <div class="accordion-controls">
            <button class="quantity-btn">-</button>
            <span class="quantity">1</span>
            <button class="quantity-btn">+</button>
            <span class="price">₹400.00</span>
            <span class="amount">₹0.00</span>
            <button class="delete-btn">🗑</button>
          </div>
        </div>
      </div>

      <div class="accordion-item">
        <div class="accordion-header">
          <span class="accordion-title">Veggie Pizza</span>
          <div class="accordion-controls">
            <button class="quantity-btn">-</button>
            <span class="quantity">1</span>
            <button class="quantity-btn">+</button>
            <span class="price">₹200.00</span>
            <span class="amount">₹350.00</span>
            <button class="delete-btn">🗑</button>
          </div>
        </div>
        <div class="accordion-body">
          <ul>
            <li>Thin Crust <span>₹150.00</span></li>
            <li>Thick Crust <span>₹200.00</span></li>
          </ul>
        </div>
      </div>
    </div>
  </body>
  <script>
    document.querySelectorAll(".accordion-header").forEach((header) => {
      header.addEventListener("click", () => {
        const item = header.parentElement;
        item.classList.toggle("active");
      });
    });
  </script>
</html>
